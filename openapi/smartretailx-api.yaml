openapi: 3.0.3
info:
  title: SmartRetailX API
  version: 1.0.0
  description: Versioned API contract for the SmartRetailX distributed retail platform.
servers:
  - url: https://api.example.com/api/v1
paths:
  /products:
    get:
      summary: List products
      responses:
        '200':
          description: Products returned
    post:
      summary: Create a product
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Product created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a product
      responses:
        '200':
          description: Product returned
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a product
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Product updated
    delete:
      summary: Delete a product
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Product deleted
  /orders:
    post:
      summary: Create an order
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Order accepted for asynchronous processing
    get:
      summary: List orders visible to the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders returned
  /orders/{orderId}:
    get:
      summary: Get order status
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order returned
        '404':
          $ref: '#/components/responses/NotFound'
  /inventory/{productId}:
    get:
      summary: Get product inventory
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventory returned
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [success, error, requestId]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller lacks permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
